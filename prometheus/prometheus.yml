global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # --- Activité d'équipe ---------------------------------------------------
  - job_name: workitems-exporter
    scrape_interval: 60s
    static_configs:
      - targets: ["workitems-exporter:9200"]

  - job_name: gitlab-ci-pipelines-exporter
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["gitlab-ci-pipelines-exporter:8080"]

  # --- Santé de l'instance GitLab (exporters intégrés à l'Omnibus) ----------
  - job_name: gitlab-rails
    metrics_path: /-/metrics
    static_configs:
      - targets: ["gitlab:80"]

  - job_name: gitlab-puma
    static_configs:
      - targets: ["gitlab:8083"]

  - job_name: gitlab-sidekiq
    static_configs:
      - targets: ["gitlab:8082"]

  - job_name: gitlab-workhorse
    static_configs:
      - targets: ["gitlab:9229"]

  - job_name: gitlab-exporter
    static_configs:
      - targets: ["gitlab:9168"]

  - job_name: gitlab-node
    static_configs:
      - targets: ["gitlab:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

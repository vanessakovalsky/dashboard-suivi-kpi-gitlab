stages: [lint, security, test, build, scan]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE: "$CI_REGISTRY_IMAGE/workitems-exporter:$CI_COMMIT_SHORT_SHA"

default:
  interruptible: true

.python:
  image: docker.io/library/python:3.13.18-slim-trixie
  cache:
    key:
      files: [exporter/pyproject.toml]
    paths: [.cache/pip]
  before_script:
    - pip install -e "exporter[dev]"

lint:python:
  extends: .python
  stage: lint
  script:
    - cd exporter && ruff check . && ruff format --check . && mypy workitems_exporter && cd ..
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - python scripts/build_dashboard.py && git diff --exit-code grafana/dashboards/

lint:containerfile:
  stage: lint
  image: docker.io/hadolint/hadolint:v2.12.0-debian
  script: [hadolint exporter/Containerfile]

lint:shell:
  stage: lint
  image: docker.io/koalaman/shellcheck-alpine:v0.10.0
  script: [shellcheck scripts/*.sh]

lint:prometheus:
  stage: lint
  image:
    name: docker.io/prom/prometheus:v3.5.0
    entrypoint: [""]
  script: [promtool check config prometheus/prometheus.yml]

security:sast:
  extends: .python
  stage: security
  script:
    - pip install semgrep==1.101.0 "setuptools<81"  # semgrep 1.101 importe pkg_resources (retiré de setuptools 81)
    - bandit -q -r exporter/workitems_exporter
    - semgrep scan --config p/python --config p/secrets --error exporter scripts

security:deps:
  extends: .python
  stage: security
  script: [pip-audit -r exporter/requirements.txt]

security:gitleaks:
  stage: security
  image:
    name: docker.io/zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script: [gitleaks git --redact -v .]

test:
  extends: .python
  stage: test
  script:
    - cd exporter && pytest --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: exporter/coverage.xml

build:
  stage: build
  image: docker.io/library/docker:27.4.1
  services: [docker.io/library/docker:27.4.1-dind]
  script:
    - docker build -t "$IMAGE" -f exporter/Containerfile exporter
    - docker save "$IMAGE" -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day

scan:trivy:
  stage: scan
  image:
    name: docker.io/aquasec/trivy:0.58.1
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

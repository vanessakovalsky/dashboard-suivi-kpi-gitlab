[project]
name = "workitems-exporter"
version = "0.1.0"
description = "Exporter Prometheus de l'activité d'équipe GitLab (work items, MR, pipelines)"
requires-python = ">=3.12"
dependencies = ["prometheus-client==0.21.1"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4", "mypy==1.14.1",
  "bandit==1.8.0", "pip-audit==2.7.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workitems_exporter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "--cov=workitems_exporter --cov-report=term-missing --cov-fail-under=80"
